# Binary Beast — Linux Runner
# Required because every dependency in app/build.gradle.kts is an
# AndroidX library (androidx.core, material, constraintlayout,
# recyclerview, lifecycle, activity-ktx). Without this flag Gradle
# refuses to build at all — this was a real missing file, not optional.
android.useAndroidX=true
android.enableJetifier=false

# Standard performance defaults for CI builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
